name: Build and semantic tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install CPU development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencv-dev ninja-build ffmpeg
          python -m venv .venv
          .venv/bin/python -m pip install --index-url https://pypi.org/simple -r requirements-lock.txt
      - name: Configure, build and test
        run: .venv/bin/python tools/build.py --jobs 2
